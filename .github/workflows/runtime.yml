name: Cells runtime contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    env:
      PYTHONPATH: runtime
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/generate_adapters.py --check
      - run: python scripts/validate_skill_quality.py
      - run: python scripts/validate_component_catalog.py
      - run: python scripts/validate_official_docs_catalog.py
      - run: python scripts/bundle.py all
      - run: python scripts/validate_bundle_parity.py
      - run: python scripts/validate_vscode_copilot_assets.py --plugin-root portable/vscode-plugin
      - run: python scripts/validate_codex_assets.py --installed-root portable/codex-home
      - run: python scripts/validate_opencode_assets.py --installed-root portable/opencode-home
