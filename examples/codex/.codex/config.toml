# Merge these optional settings with your existing Codex configuration.
[features]
codex_hooks = true

[agents]
max_concurrent_threads_per_session = 4

[mcp_servers.cells]
command = "python3"
args = ["-c", "import pathlib,runpy,sys; p=pathlib.Path.home()/'.codex/runtime'; sys.path.insert(0,str(p)); sys.argv=[str(p/'cells-agent.py'),'mcp']; runpy.run_path(str(p/'cells-agent.py'),run_name='__main__')"]
