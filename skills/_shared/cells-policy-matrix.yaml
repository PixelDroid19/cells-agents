version: 3
scope: cells-runtime-v3
contracts:
  - id: work-sizing
    file: skills/_shared/cells-work-sizing-contract.md
    invariants:
      - selects fast-path, scoped-change, full-workflow, or blocked proportionately
      - user authorization controls directly scoped source writes
      - workflow artifacts are optional unless the user requests a governed chain
  - id: persistence
    file: skills/_shared/persistence-contract.md
    invariants:
      - active workflow artifact persistence is none or openspec
      - LocalMemory is optional and separate from workflow evidence
      - legacy Engram configuration is migration-only
  - id: source-routing
    file: skills/_shared/cells-source-routing-contract.md
    invariants:
      - catalogs are primary for bundled Cells knowledge
      - project code and CEM data are ordered fallback evidence
      - installed scripts resolve executable commands
  - id: governance
    file: skills/_shared/cells-governance-contract.md
    invariants:
      - workflow statuses are success, partial, or blocked
      - scope and evidence claims are explicit
      - repository contribution policy applies only to requested contribution actions
  - id: cells-rules
    file: skills/_shared/cells-rules-contract.md
    invariants:
      - BBVA component reuse precedes new component authoring
      - scoped elements, local architecture, and i18n conventions are preserved
      - legacy installed lit-component wrappers remain valid when resolved
  - id: handoff
    file: skills/_shared/cells-agent-handoff-contract.md
    invariants:
      - delegation is optional and bounded
      - handoffs contain known scope, evidence, and acceptance information
      - no artificial retry limit replaces evidence-based progress
  - id: workflow
    file: skills/_shared/cells-workflow-contract.md
    invariants:
      - governed planning order is proposal, spec, design, tasks
      - direct scoped work does not require a governed chain
      - artifacts and memory are never fabricated to satisfy a template
